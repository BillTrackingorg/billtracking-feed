# Deploy this repository to GitHub Pages from Actions, with a fingerprint per legislature.
#
# WHAT THIS IS. GitHub Pages serves this repository's files to the app, the website and the
# website's renderer. Until the owner switches Settings → Pages → Source to "GitHub Actions",
# GitHub's branch build serves them and this workflow only builds and checks (it deploys
# nothing). After the switch it is the deploy: every push here stages the files, checks each
# against the bytes the commit records, writes `<polity>-fingerprint.json` beside the month
# files, and deploys. A reader's app reads a legislature's fingerprint first and asks only for
# the month files whose sha256 changed (the app's OPEN-ITEMS OI-0329; the design is the app's
# `docs/FEED-LOADING.md`).
#
# ROLLBACK. Settings → Pages → Source back to "Deploy from a branch", `main`, `/ (root)`. The
# branch build serves the same files again; the fingerprints stop being served, and the app
# then reads every month as it did before them. Nothing in the repository changes.
#
# FAILURE POSTURE (the app's loudness doctrine). A file that differs from what the commit
# records stops the run red and deploys nothing: the live site keeps the last good deploy. A
# failed deploy is red too. Both reach the owner by GitHub's failure mail. The site's size
# against GitHub's 1 GB limit is an annotation at 70% and 90%, never a stopped deploy.
#
# QUEUE. One deploy at a time (the `pages` group). A push that arrives while one runs waits;
# a third replaces the waiting second, which loses nothing because each run checks out `main`
# by name and so deploys the tip. `render-site.yml` waits for Pages to serve a push before it
# asks the website to render, as it did with the branch build.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # read the Pages source; deploy once it is "GitHub Actions"
  id-token: write    # the deploy proves where it runs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 (the bots' pin)
        with:
          ref: main

      - name: Stage, check and fingerprint
        run: python3 .github/scripts/pages_stage.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # `.nojekyll`, which the branch build served

      # Deploy only once the owner has switched the source. Before that, GitHub's branch
      # build serves the site and a deploy from here would fail.
      - name: Is the Pages source "GitHub Actions"?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "Pages source: ${type}"
          if [ "$type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Built and checked, not deployed: the branch build serves this site until the source is switched." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
