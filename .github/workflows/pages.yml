# Deploy this repository to GitHub Pages from Actions, with a fingerprint per legislature.
#
# WHAT THIS IS. GitHub Pages serves this repository's files to the app, the website and the
# website's renderer, at https://feed.billtracking.org. Since 2026-10-29 Settings → Pages →
# Source is "GitHub Actions", and this workflow is the deploy: every push here stages the
# files, checks each against the bytes the commit records, writes `<polity>-fingerprint.json`
# beside the month files, and deploys. On a branch build (a rollback) GitHub's branch build
# serves them and this workflow only builds and checks (it deploys nothing). A reader's app
# reads a legislature's fingerprint first and asks only for the month files whose sha256
# changed (the app's OPEN-ITEMS OI-0329).
# In shadow beside them, each legislature's search files under `search/`, listed in its
# fingerprint's "derived" block, which no app reads yet (the step "Search files (shadow)").
#
# THE SWITCH: THE OWNER'S SITTING, IN THIS ORDER (done 2026-10-29; the same steps switch the
# source back after a rollback). Not rehearsed: how long the feed goes without a fresh deploy
# across the click, and what GitHub does on a switch back, have not been measured.
#   1. Only once the app's 404 fix and its feed-host early warning (slices A and E of the
#      feed scale build) are merged, and the notice sender has been redeployed with the 404
#      fix (`npm run deploy:sender` in the app). A client without it keeps a 404 as an empty
#      month, and the click may bring a moment of 404s.
#   2. This workflow's run for main's latest push is green ("Built and checked, not
#      deployed"), and no bot publish is in flight.
#   2b. In the app's Supabase, switch the notice job off (the app's
#      supabase/functions/README.md: switching the job off stops both). A sender run that
#      holds no saved copy would read a month the host 404s as empty for that run.
#   3. Settings → Pages → Build and deployment → Source: "GitHub Actions". Choose that and
#      nothing else: this repository already has its workflow, this one. Do not click
#      "Configure" on any workflow GitHub suggests there; committing one adds a second deploy
#      that serves no fingerprints.
#   4. At once: Actions → pages → Run workflow (branch main).
#   It worked when that run's deploy job is green,
#   https://feed.billtracking.org/us-fingerprint.json (and eu-) answers
#   200 with main's latest commit in "commit", and its Last-Modified is the same as a month
#   file's (`curl -sI` on both: one deploy, one time, which the app's canary relies on).
#   5. Then switch the notice job back on.
#   6. In the app, a session sets the daily canary's FINGERPRINTS_SERVED to true, with its
#      pin (the app's docs/FEED-HOST-RUNBOOK.md, "Where the numbers are"). Until it does,
#      the canary files one issue asking for it.
#
# ROLLBACK. Settings → Pages → Source: "Deploy from a branch", `main`, `/ (root)`. GitHub
# should then start a "pages build and deployment" run that serves the same files again (not
# yet seen here): check Actions for it, and if none starts, ask for one
# (`gh api -X POST repos/BillTrackingorg/billtracking-feed/pages/builds`, the owner's call).
# The fingerprints stop being served, and the app reads every month as it did before them; a
# session sets the app canary's FINGERPRINTS_SERVED (and FINGERPRINTS_LIVE_ON_BOTH_PLATFORMS)
# back to false.
# ⚠️ THE FEED HAS ITS OWN ADDRESS (feed.billtracking.org): a branch build keeps its custom
# domain in a `CNAME` file at the root of the branch (GitHub's docs), which a deploy from here
# never needs. One is committed to main for that alone, holding the one line
# `feed.billtracking.org` (under Actions it is served as an ordinary file and changes
# nothing). Before switching back, confirm it is still on main; without it the branch build
# can drop the address and readers of feed.billtracking.org get GitHub's 404. After the
# branch build, confirm that `gh api repos/BillTrackingorg/billtracking-feed/pages --jq .cname`
# prints the address.
#
# ⚠️ TO DEPLOY AGAIN, USE "Run workflow", NEVER "Re-run" ON AN OLD RUN. A re-run deploys
# that run's own artifact, which can be older than main. The deploy job therefore checks
# that its build is still main's tip and deploys nothing otherwise; a re-run that finds main
# has moved is red, because it may have taken the place of the newer push's waiting run.
#
# FAILURE POSTURE (the app's loudness doctrine). Stopped red, nothing deployed, the live
# site keeping the last good deploy: a file that differs from what the commit records, a
# symbolic link, or a committed `<polity>-fingerprint.json` (`pages_stage.py` names each);
# and the search files' step cut by its clock, or unable to give back a record a builder
# changed (the step's comment).
# Deployed, then red: a month file or corrections sheet that is not UTF-8 or starts with a
# byte-order mark. Its legislature goes out without a fingerprint (the app reads its files
# the old way) and every other legislature deploys as usual; the error names the file's
# source in its bot's repository, where the fix belongs. A failed deploy is red too. Each
# reaches the owner by GitHub's failure mail. The site's size against GitHub's 1 GB limit is
# an annotation at 70% and 90%, never a stopped deploy. Deployed, green, with an error
# annotation: a legislature whose search files could not be built, proven or checked (they
# are left out of its fingerprint; nothing else changes), or a record a builder changed,
# staged again from the commit with no search files.
#
# QUEUE. One deploy at a time (the `pages` group). A push that arrives while one runs waits;
# a third replaces the waiting second, which loses nothing because each run checks out `main`
# by name and so deploys the tip (a re-run of an old run is the exception, above).
# `render-site.yml` waits for Pages to serve a push before it asks the website to render, as
# it did with the branch build. A deployment's record names the push that started the run;
# what it served is main's tip, which the fingerprints' `commit` names.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read        # read the Pages source
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
      commit: ${{ steps.commit.outputs.sha }}
      unchecked: ${{ steps.stage.outputs.unchecked }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 (the bots' pin)
        with:
          ref: main

      - name: The commit this run builds
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Exit 3: a legislature goes out without its fingerprint (a file the app could not
      # check); the deploy goes ahead and the last job turns the run red. Any other failure
      # stops the run here, nothing deployed.
      - name: Stage, check and fingerprint
        id: stage
        run: |
          rc=0
          python3 .github/scripts/pages_stage.py _site || rc=$?
          if [ "$rc" -eq 3 ]; then echo "unchecked=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"

      # THE SEARCH FILES, IN SHADOW (the app's search design of 2026-10-29, §5; app OI-0108).
      # Each builder in .github/tools/ (the app's own core, compiled per derivation digest by
      # the app's `npm run build:feed-core`) builds every fingerprinted legislature's search
      # files from the staged record, proves them, and writes them; the stage then checks
      # them, places them under search/ and lists them in each fingerprint's "derived" block.
      # No app or website reads them yet. A failure here only leaves them out: an error
      # annotation on a green run (Class 1 of the app's loudness doctrine), never a held-back
      # month file, sheet or fingerprint. Each builder reads a copy of the staged site of its
      # own, never the folder that is served, and the site is checked afterwards against what
      # the stage wrote (`pages_stage.py --derive`). "As of" is the month of the commit, in
      # UTC, so a rebuild of one commit gives the same bytes; every month before it gets its base.
      # FAIL CLOSED. The upload must never read a site this step could not vouch for, so the
      # step has no continue-on-error: a cut by its clock, or a site a builder changed that
      # cannot be staged again as the stage wrote it (exit 2), fails the step, and the run stops
      # red before the upload. Nothing is deployed, the live site keeps the last deploy, and
      # the next push deploys again.
      # THE CLOCK. This step sits in front of every deploy, and render-site goes red when no
      # deploy of a push has landed within its five-minute wait (a pages run takes about half a
      # minute; render-site has seen a deploy land 6 to 68 s into its wait). So the builders get
      # 90 s and are killed at it (BUILD_SECONDS), which costs only their search files; `timeout`
      # cuts the whole command at 105 s, inside the two-minute limit (the backstop, which stops
      # only the step's shell). The worst case that deploys lands about two and a quarter
      # minutes later, inside render-site's wait; a cut deploys nothing, so render-site goes red
      # after it too. Both legislatures took 1.0 s on 2026-11-05; the builder warns past 60 s
      # that the build cache the design left out is due.
      - name: Search files (shadow)
        if: steps.stage.outcome == 'success'
        timeout-minutes: 2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PYTHONUNBUFFERED: "1"   # a cut keeps every line printed before it
        run: |
          asof=$(TZ=UTC git show -s --date=format-local:%Y-%m --format=%cd HEAD)
          rc=0
          timeout -k 5 105 python3 .github/scripts/pages_stage.py --derive _site "$asof" _derived .github/tools || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::The search files' step was cut by its clock, crashed, or could not give back the site as the stage wrote it (exit ${rc}), so nothing is deployed this run: the live site still serves the last deploy, and the next push deploys again. The app's docs/FEED-HOST-RUNBOOK.md, \"The search files\"."
          fi
          exit "$rc"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # `.nojekyll`, which the branch build served

      # Deploy only while the source is "GitHub Actions", as it is since 2026-10-29. On a
      # branch build (a rollback) GitHub deploys every push itself, and a deploy from here
      # would be accepted and race it (the two do not share a concurrency group), so this run
      # then deploys nothing. One retry, so a passing API error does not turn an inert run
      # red.
      - name: Is the Pages source "GitHub Actions"?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null) \
            || { sleep 10; type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type); }
          echo "Pages source: ${type}"
          if [ "$type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Built and checked, not deployed: the branch build serves this site until the source is switched." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write       # deploy
      id-token: write    # the deploy proves where it runs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A re-run of an old run would deploy that run's older artifact. Deploy only while the
      # build is still main's tip; a newer push has its own run, which deploys it. A re-run
      # that finds main moved is red: it may have displaced that newer run while it waited.
      - name: Is this build still main's tip?
        id: tip
        env:
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$BUILT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::error::A re-run of an old run: it built ${BUILT:0:9}, and main is now ${tip:0:9}, so it deploys nothing, and it may have taken the place of the newer push's waiting run. Deploy main with Actions → pages → Run workflow."
            exit 1
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Not deployed: this run built ${BUILT:0:9}, and main is now ${tip:0:9}; the run for that push deploys it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Red AFTER the deploy (or after the inert build on a branch build, after a rollback), so
  # one file the app cannot check never holds back every legislature. The build job's error
  # names the file and its source in the bot's repository. Not after a build that failed later
  # (the search files' step, failing closed): then nothing went out.
  unchecked:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.unchecked == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A legislature went out without its fingerprint
        run: |
          echo "::error::A month file or corrections sheet is not UTF-8 or starts with a byte-order mark, so its legislature went out without its fingerprint, and the app reads that legislature's files the old way. The build job's error names the file and its source in the bot's repository, where the fix belongs (a fix made here is undone by the next publish). Red until it is fixed there."
          exit 1
